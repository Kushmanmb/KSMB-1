[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksmb-1"
version = "0.1.0"
description = "Experimental post-quantum cryptographic research project"
requires-python = ">=3.10"
dependencies = [
    "cryptography"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
